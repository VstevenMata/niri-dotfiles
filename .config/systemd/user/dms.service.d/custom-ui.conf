# Arranca DMS con el parche visual de la pantalla de bloqueo (ver ~/.local/bin/dms-run-custom).
# Para volver a DMS normal: borra este archivo y ejecuta
#   systemctl --user daemon-reload && systemctl --user restart dms
[Service]
ExecStart=
ExecStart=%h/.local/bin/dms-run-custom
# Si quickshell crashea, dms sale con 0 y on-failure no lo relanzaba: te quedabas sin barra
Restart=always
